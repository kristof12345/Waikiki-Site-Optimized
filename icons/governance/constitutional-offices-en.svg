<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Detailed constitutional offices of Waikiki</title><desc id="desc">A detailed constitutional chart showing the Dictator, Chancellor, President, Cabinet, Parliament, Congress, Senate, Supreme Court and lower courts.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06262d"/><stop offset=".55" stop-color="#082b3e"/><stop offset="1" stop-color="#061a2c"/></linearGradient><linearGradient id="apex" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155167"/><stop offset="1" stop-color="#0a2c49"/></linearGradient><style>text{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.k{font-size:9.5px;font-weight:800;letter-spacing:1.2px;fill:#a9dfe4}.t{font-size:17px;font-weight:800;letter-spacing:.55px;fill:#fff9e9}.b{font-size:11px;font-weight:600;fill:#d0e5e6}.f{font-size:10px;font-weight:700;fill:#d7e9eb}.n{font-size:9.5px;font-weight:800;letter-spacing:.7px;fill:#dfc183}</style></defs>
  <rect width="1160" height="720" rx="24" fill="url(#bg)"/><g opacity=".17" stroke="#84cbd8" stroke-width=".7" stroke-dasharray="3 8"><path d="M45 72H1115M45 175H1115M45 310H1115M45 445H1115M45 585H1115M45 675H1115"/><path d="M55 28V688M290 28V688M580 28V688M870 28V688M1105 28V688"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M580 147V170H205V195M580 147V195M580 147V170H955V195" stroke="#dfba76" stroke-width="2.2"/><path d="M580 295V330M580 426V465" stroke="#70d2d1" stroke-width="2.4"/><path d="M450 245H385V410H330M710 245H775V410H830" stroke="#dfba76" stroke-width="2" stroke-dasharray="6 7" class="dash"/><path d="M580 555V585M710 625H765" stroke="#b7a1ef" stroke-width="2.2" stroke-dasharray="5 6" class="dash"/><path d="M955 295V465H730" stroke="#dfba76" stroke-width="1.7" stroke-dasharray="5 7" class="dash"/></g>
  <g class="n"><text x="205" y="171">DEPUTY</text><text x="580" y="171">EXECUTIVE MANDATE</text><text x="955" y="171">LEGISLATIVE AUTHORITY</text><text x="398" y="399">ELECTS</text><text x="762" y="399">CONFIRMS</text><text x="790" y="455">PRESIDENT'S RECOMMENDATION</text></g>
  <g transform="translate(580 87)"><rect x="-170" y="-60" width="340" height="120" rx="22" fill="url(#apex)" stroke="#dfba76" stroke-width="2.4"/><path d="M-14-27h28M-11-27v-12h22v12M-7-39v-9h14v9M-3-48v-7h6v7" fill="none" stroke="#f9d889" stroke-width="2"/><text class="k" y="-4">HEAD OF STATE · UNLIMITED TERM</text><text class="t" y="21">DICTATOR</text><text class="b" y="42">Signs or vetoes laws · appoints Chancellor</text></g>
  <g transform="translate(205 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#103c49" stroke="#75c9d7" stroke-width="1.8"/><text class="k" y="-19">CONTINUITY</text><text class="t" y="5">CHANCELLOR</text><text class="b" y="27">Deputy to the Dictator</text><text class="f" y="42">President of the Budget Council</text></g>
  <g transform="translate(580 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#0c4d59" stroke="#70d2d1" stroke-width="2"/><text class="k" y="-19">GOVERNMENT LEADERSHIP</text><text class="t" y="5">PRESIDENT</text><text class="b" y="27">Directs general government policy</text><text class="f" y="42">Coordinates with Dictator and Senate</text></g>
  <g transform="translate(955 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#493613" stroke="#dfba76" stroke-width="1.8"/><text class="k" y="-19" fill="#f3dba6">BICAMERAL LEGISLATURE</text><text class="t" y="5">PARLIAMENT</text><text class="b" y="27">Congress + Senate · 200 votes</text><text class="f" y="42">Makes laws and oversees Government</text></g>
  <g transform="translate(580 378)"><rect x="-150" y="-48" width="300" height="96" rx="18" fill="#0b3844" stroke="#70d2d1" stroke-width="1.9"/><text class="k" y="-18">EXECUTIVE ADMINISTRATION</text><text class="t" y="4">MINISTERS &amp; CABINET</text><text class="b" y="25">Propose bills and manage portfolios</text><text class="f" y="40">Congress approves the ministerial list</text></g>
  <g transform="translate(205 455)"><rect x="-150" y="-45" width="300" height="90" rx="17" fill="#392908" stroke="#d7b369" stroke-width="1.6"/><text class="k" y="-15" fill="#f3dba6">ELECTED CHAMBER</text><text class="t" y="5">CONGRESS</text><text class="b" y="27">Elects the President and Government</text><text class="f" y="42">100 representatives</text></g>
  <g transform="translate(955 455)"><rect x="-150" y="-45" width="300" height="90" rx="17" fill="#392908" stroke="#d7b369" stroke-width="1.6"/><text class="k" y="-15" fill="#f3dba6">CONSTITUTIONAL CHAMBER</text><text class="t" y="5">SENATE</text><text class="b" y="27">Composition set by the Dictator</text><text class="f" y="42">100 senators · confirms Supreme Court</text></g>
  <g transform="translate(580 510)"><rect x="-150" y="-45" width="300" height="90" rx="18" fill="#0c3845" stroke="#70d2d1" stroke-width="1.7"/><text class="k" y="-15">MINISTERIAL POWERS</text><text class="b" y="7">Issue portfolio decrees · initiate referendums</text><text class="f" y="28">Individual responsibility for public administration</text></g>
  <g transform="translate(580 625)"><rect x="-150" y="-40" width="300" height="80" rx="17" fill="#37295b" stroke="#baa7eb" stroke-width="1.9"/><text class="k" y="-12" fill="#ded4ff">JUDICIAL REVIEW</text><text class="t" y="14">SUPREME COURT</text><text class="f" y="30">Invalidates unconstitutional legislation</text></g>
  <g transform="translate(915 625)"><rect x="-150" y="-40" width="300" height="80" rx="17" fill="#2b234b" stroke="#a995df" stroke-width="1.5"/><text class="k" y="-12" fill="#ded4ff">FOUR-LEVEL JUDICIARY</text><text class="b" y="11">Provincial · Regional · County courts</text><text class="f" y="28">Independent judicial administration</text></g>
</svg>
