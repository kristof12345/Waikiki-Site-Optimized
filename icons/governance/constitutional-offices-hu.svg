<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Waikiki részletes alkotmányos tisztségei</title><desc id="desc">Részletes alkotmányos ábra a Diktátorral, Kancellárral, Elnökkel, miniszterekkel, Parlamenttel, Kongresszussal, Szenátussal, Legfelsőbb Bírósággal és alsóbb bíróságokkal.</desc>
