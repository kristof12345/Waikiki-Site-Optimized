  <g transform="translate(580 510)"><rect x="-150" y="-45" width="300" height="90" rx="18" fill="#0c3845" stroke="#70d2d1" stroke-width="1.7"/><text class="k" y="-15">MINISZTERI HATÁSKÖRÖK</text><text class="b" y="7">Tárcarendeletet alkotnak · népszavazást kezdeményeznek</text><text class="f" y="28">Egyéni felelősség a közigazgatási szakterületekért</text></g>
