<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
  <title id="title">Waikiki alkotmányos tisztségei</title>
  <desc id="desc">Alkotmányos tisztségi ábra a Diktátorral, Kancellárral, Elnökkel és miniszterekkel, a Parlamenttel és a bíróságokkal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06252b"/><stop offset=".55" stop-color="#082b3e"/><stop offset="1" stop-color="#061a2c"/></linearGradient><linearGradient id="apex" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#155167"/><stop offset="1" stop-color="#0a2c49"/></linearGradient>
    <style>@keyframes dashFlow{to{stroke-dashoffset:-26}}@keyframes nodeGlow{0%,100%{opacity:.35}50%{opacity:1}}text{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.kicker{font-size:10px;font-weight:800;letter-spacing:1.25px;fill:#a9dfe4}.title{font-size:18px;font-weight:800;letter-spacing:.45px;fill:#fff9e9}.body{font-size:11.5px;font-weight:600;fill:#d0e5e6}.note{font-size:10px;font-weight:800;letter-spacing:.65px;fill:#dfc183}.dash{animation:dashFlow 3.4s linear infinite}.signal{animation:nodeGlow 3.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.dash,.signal{animation:none!important}}</style>
  </defs>
  <rect width="1160" height="590" rx="24" fill="url(#bg)"/><g opacity=".18" stroke="#83cbd8" stroke-width=".7" stroke-dasharray="3 8"><path d="M45 75H1115M45 180H1115M45 345H1115M45 485H1115M45 550H1115"/><path d="M50 30V560M370 30V560M580 30V560M790 30V560M1110 30V560"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M580 154V178H200V195M580 154V195M580 154V178H960V195" stroke="#dfba76" stroke-width="2.2"/><path d="M580 295V365" stroke="#70d2d1" stroke-width="2.4"/><path d="M450 245H340V395" stroke="#dfba76" stroke-width="2" stroke-dasharray="6 7" class="dash"/><path d="M710 245H820V395" stroke="#dfba76" stroke-width="2" stroke-dasharray="6 7" class="dash"/><path d="M580 455V495" stroke="#b7a1ef" stroke-width="2.2"/><path d="M730 530H790" stroke="#b7a1ef" stroke-width="2" stroke-dasharray="5 6" class="dash"/></g><g class="note"><text x="200" y="178">HELYETTES</text><text x="580" y="178">KORMÁNY</text><text x="960" y="178">TÖRVÉNYHOZÁS</text><text x="390" y="360">MEGVÁLASZTJA</text><text x="770" y="360">JÓVÁHAGYJA</text></g>
  <g transform="translate(580 92)"><rect x="-170" y="-62" width="340" height="124" rx="22" fill="url(#apex)" stroke="#dfba76" stroke-width="2.4"/><circle cy="-21" r="20" fill="#d9b96e" opacity=".18"/><path d="M-14-11h28M-11-11v-12h22v12M-7-23v-9h14v9M-3-32v-7h6v7" fill="none" stroke="#f9d889" stroke-width="2"/><text class="kicker" y="13">ÁLLAMFŐ</text><text class="title" y="38">DIKTÁTOR</text><text class="body" y="55">Alkotmányos hatalom és nemzeti folytonosság</text></g>
  <g transform="translate(200 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#103c49" stroke="#75c9d7" stroke-width="1.8"/><text class="kicker" y="-19">FOLYTONOSSÁG</text><text class="title" y="7">KANCELLÁR</text><text class="body" y="29">A Diktátor helyettese</text></g>
  <g transform="translate(580 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#0c4d59" stroke="#70d2d1" stroke-width="2"/><text class="kicker" y="-19">VÉGREHAJTÓ VEZETÉS</text><text class="title" y="7">ELNÖK</text><text class="body" y="29">A választott kormány irányítója</text></g>
  <g transform="translate(960 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#493613" stroke="#dfba76" stroke-width="1.8"/><text class="kicker" y="-19" fill="#f3dba6">KÉTKAMARÁS TÖRVÉNYHOZÁS</text><text class="title" y="7">PARLAMENT</text><text class="body" y="29">Kongresszus és Szenátus</text></g>
  <g transform="translate(580 410)"><rect x="-150" y="-45" width="300" height="90" rx="18" fill="#0b3844" stroke="#70d2d1" stroke-width="1.9"/><text class="kicker" y="-14">VÉGREHAJTÓ IGAZGATÁS</text><text class="title" y="9">MINISZTEREK ÉS KABINET</text><text class="body" y="29">Közigazgatás és szakpolitikai végrehajtás</text></g>
  <g transform="translate(200 410)"><rect x="-150" y="-40" width="300" height="80" rx="17" fill="#392908" stroke="#d7b369" stroke-width="1.6"/><text class="kicker" y="-11" fill="#f3dba6">MEGVÁLASZTJA AZ ELNÖKÖT</text><text class="title" y="12">KONGRESSZUS</text><text class="body" y="29">100 képviselő</text></g>
  <g transform="translate(960 410)"><rect x="-150" y="-40" width="300" height="80" rx="17" fill="#392908" stroke="#d7b369" stroke-width="1.6"/><text class="kicker" y="-11" fill="#f3dba6">A DIKTÁTOR NEVEZI KI</text><text class="title" y="12">SZENÁTUS</text><text class="body" y="29">100 szenátor</text></g>
  <g transform="translate(580 530)"><rect x="-150" y="-35" width="300" height="70" rx="17" fill="#37295b" stroke="#baa7eb" stroke-width="1.9"/><text class="kicker" y="-10" fill="#ded4ff">ALKOTMÁNYOSSÁGI VIZSGÁLAT</text><text x="0" y="15" font-size="16" font-weight="800" letter-spacing=".35" fill="#fff9e9">LEGFELSŐBB BÍRÓSÁG</text></g>
  <g transform="translate(950 530)"><rect x="-150" y="-35" width="300" height="70" rx="17" fill="#2b234b" stroke="#a995df" stroke-width="1.5"/><text class="kicker" y="-10" fill="#ded4ff">NÉGYSZINTŰ IGAZSÁGSZOLGÁLTATÁS</text><text class="body" y="13">Megyei · regionális · tartományi bíróságok</text></g>
</svg>
