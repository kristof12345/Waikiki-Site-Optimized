  <g transform="translate(580 87)"><rect x="-170" y="-60" width="340" height="120" rx="22" fill="url(#apex)" stroke="#dfba76" stroke-width="2.4"/><path d="M-14-27h28M-11-27v-12h22v12M-7-39v-9h14v9M-3-48v-7h6v7" fill="none" stroke="#f9d889" stroke-width="2"/><text class="k" y="-4">ÁLLAMFŐ · KORLÁTLAN MANDÁTUM</text><text class="t" y="21">DIKTÁTOR</text><text class="b" y="42">Törvényeket ír alá vagy vétóz · Kancellárt nevez ki</text></g>
  <g transform="translate(205 245)"><rect x="-150" y="-50" width="300" height="100" rx="18" fill="#103c49" stroke="#75c9d7" stroke-width="1.8"/><text class="k" y="-19">FOLYTONOSSÁG</text><text class="t" y="5">KANCELLÁR</text><text class="b" y="27">A Diktátor helyettese</text><text class="f" y="42">A Költségvetési Tanács elnöke</text></g>
