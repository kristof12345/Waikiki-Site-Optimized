<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Sovereign Nation of Waikiki Logo">
  <!-- =======================================================================
       WAIKIKI BRAND MARK (2D VECTOR STYLE)
       A simple pyramid with one palm tree on each side under a tropical sun.
       ======================================================================= -->
  <defs>
    <!-- Radiant 2D Sun Gradient -->
    <linearGradient id="sun2D" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="60%" stop-color="#F5BD47"/>
      <stop offset="100%" stop-color="#E3735A"/>
    </linearGradient>

    <!-- Warm Dune Shoreline Gradient -->
    <linearGradient id="dune2D" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A3752C"/>
      <stop offset="50%" stop-color="#E5BA62"/>
      <stop offset="100%" stop-color="#A3752C"/>
    </linearGradient>
  </defs>

  <!-- 1. SUN & RAYS -->
  <circle cx="60" cy="42" r="20" fill="url(#sun2D)"/>
  <circle cx="60" cy="42" r="14.5" fill="#FFE89E" opacity="0.6"/>

  <!-- 2D Geometric Sun Rays -->
  <g stroke="#F5BD47" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="60" y1="13" x2="60" y2="18"/>
    <line x1="38" y1="20" x2="42" y2="24"/>
    <line x1="82" y1="20" x2="78" y2="24"/>
    <line x1="29" y1="37" x2="34" y2="39"/>
    <line x1="91" y1="37" x2="86" y2="39"/>
  </g>

  <!-- 2. CENTRAL SIMPLE PYRAMID -->
  <!-- Left Face: Sunlit Warm Gold -->
  <polygon points="60,25 28,93 60,98" fill="#E5BA62"/>
  <!-- Right Face: Deep Bronze Shade -->
  <polygon points="60,25 60,98 92,93" fill="#8C5E1B"/>
  <!-- Center Ridge Highlight Line -->
  <line x1="60" y1="25" x2="60" y2="98" stroke="#FFF4CC" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Golden Pyramidion Capstone -->
  <polygon points="60,25 52,38 60,39.5" fill="#FFF9E0"/>
  <polygon points="60,25 60,39.5 68,38" fill="#F2B84B"/>
  <!-- Apex Diamond Sparkle -->
  <polygon points="60,21 61.8,25 60,29 58.2,25" fill="#FFFFFF"/>

  <!-- 3. SHORELINE & DUNES -->
  <path d="M10 93 C26 90.5 42 94 60 92.5 C78 91 94 94.5 110 93 L110 97 C94 98 78 95 60 96.5 C42 98 26 95 10 97 Z" fill="url(#dune2D)"/>
  <path d="M14 97 C30 95 44 98 60 96.5 C76 95 90 98 106 97 C94 100.5 76 99.5 60 100 C44 99.5 26 100.5 14 97 Z" fill="#11605B"/>

  <!-- 4. LEFT PALM TREE -->
  <g id="palm-left">
    <!-- Trunk -->
    <path d="M19 96 C18 78 22 62 25 44 L28.2 44.5 C25 62.5 21 78.5 22.2 96 Z" fill="#6B3813"/>
    <path d="M19.5 96 C20.5 78.5 24 62.5 27 44.5 L28.2 44.5 C25.2 62.5 21.5 78.5 21 96 Z" fill="#8F5224" opacity="0.6"/>
    <!-- Coconuts Cluster -->
    <circle cx="24" cy="45" r="2.2" fill="#C29A57"/>
    <circle cx="27" cy="46.5" r="2" fill="#8C5E1B"/>
    <!-- 2D Fronds -->
    <!-- Frond 1: High arch curving left -->
    <path d="M26 43 C22 28 11 26 5 32 C13 34 20 38 26 43 Z" fill="#2A8C83"/>
    <!-- Frond 2: Peak center frond pointing up-right -->
    <path d="M26 43 C29 27 38 23 46 27 C40 33 34 38 26 43 Z" fill="#11605B"/>
    <!-- Frond 3: Upper-left sweep -->
    <path d="M26 43 C18 35 7 38 3 47 C11 46 19 45 26 43 Z" fill="#3FB3A6"/>
    <!-- Frond 4: Lower drooping left -->
    <path d="M26 43 C15 47 7 57 8 68 C14 59 20 52 26 43 Z" fill="#134F4A"/>
    <!-- Frond 5: Inward arch framing pyramid -->
    <path d="M26 43 C33 41 40 46 43 55 C37 51 31 47 26 43 Z" fill="#1E736B"/>
  </g>

  <!-- 5. RIGHT PALM TREE -->
  <g id="palm-right">
    <!-- Trunk -->
    <path d="M101 96 C102 78 98 62 95 44 L91.8 44.5 C95 62.5 99 78.5 97.8 96 Z" fill="#6B3813"/>
    <path d="M100.5 96 C99.5 78.5 96 62.5 93 44.5 L91.8 44.5 C94.8 62.5 98.5 78.5 99 96 Z" fill="#8F5224" opacity="0.6"/>
    <!-- Coconuts Cluster -->
    <circle cx="96" cy="45" r="2.2" fill="#C29A57"/>
    <circle cx="93" cy="46.5" r="2" fill="#8C5E1B"/>
    <!-- 2D Fronds (Symmetrical Balance) -->
    <!-- Frond 1: High arch curving right -->
    <path d="M94 43 C98 28 109 26 115 32 C107 34 100 38 94 43 Z" fill="#2A8C83"/>
    <!-- Frond 2: Peak center frond pointing up-left -->
    <path d="M94 43 C91 27 82 23 74 27 C80 33 86 38 94 43 Z" fill="#11605B"/>
    <!-- Frond 3: Upper-right sweep -->
    <path d="M94 43 C102 35 113 38 117 47 C109 46 101 45 94 43 Z" fill="#3FB3A6"/>
    <!-- Frond 4: Lower drooping right -->
    <path d="M94 43 C105 47 113 57 112 68 C106 59 100 52 94 43 Z" fill="#134F4A"/>
    <!-- Frond 5: Inward arch framing pyramid -->
    <path d="M94 43 C87 41 80 46 77 55 C83 51 89 47 94 43 Z" fill="#1E736B"/>
  </g>
</svg>