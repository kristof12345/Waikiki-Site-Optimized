<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none" style="color: #003366;">
  <defs>
    <linearGradient id="sts2Body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.12" />
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.28" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="sts2Booster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.15" />
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.32" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="sts2Wing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.22" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.08" />
    </linearGradient>
    <pattern id="sts2Grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Coordinate Grid -->
  <rect x="20" y="20" width="760" height="760" fill="url(#sts2Grid)" />

  <!-- Technical Axis and Grid -->
  <g opacity="0.25" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="400" y1="25" x2="400" y2="775" />
    <line x1="25" y1="400" x2="775" y2="400" />
    <circle cx="400" cy="400" r="350" />
    <circle cx="400" cy="400" r="220" />
    <circle cx="400" cy="400" r="100" />
  </g>

  <!-- Dimensions Callouts -->
  <g opacity="0.6" stroke="currentColor" stroke-width="1">
    <!-- Height bar -->
    <line x1="160" y1="45" x2="130" y2="45" />
    <line x1="160" y1="755" x2="130" y2="755" />
    <line x1="145" y1="45" x2="145" y2="755" stroke-dasharray="4 4" />
    <text x="130" y="400" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="11" letter-spacing="2" opacity="0.85" transform="rotate(-90 130 400)" stroke="none">HEIGHT 78.0 M</text>

    <!-- Width / Diameter bar -->
    <line x1="300" y1="765" x2="300" y2="785" />
    <line x1="500" y1="765" x2="500" y2="785" />
    <line x1="300" y1="775" x2="500" y2="775" stroke-dasharray="4 4" />
    <text x="400" y="792" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="10.5" letter-spacing="2" opacity="0.85" stroke="none">SPAN 28.0 M</text>
  </g>

  <!-- Rocket Technical Vector Graphic -->
  <g id="vehicle-graphic">
    <!-- Advanced Central Core Tank -->
    <path d="M 376 110 C 376 60 400 40 400 40 C 400 40 424 60 424 110 L 424 690 C 424 705 376 705 376 690 Z" fill="url(#sts2Body)" stroke="currentColor" stroke-width="2.2" />

    <!-- Twin Advanced Liquid Flyback Boosters -->
    <!-- Left Flyback Booster with Canted Canards -->
    <g stroke="currentColor" stroke-width="2">
      <path d="M 320 180 C 320 130 338 115 338 115 C 338 115 356 130 356 180 Z" fill="url(#sts2Booster)" />
      <rect x="320" y="180" width="36" height="515" fill="url(#sts2Booster)" />
      <!-- Canard Fin -->
      <polygon points="320,220 285,250 285,260 320,245" fill="url(#sts2Wing)" stroke-width="1.6" />
      <!-- Engine Nozzles -->
      <polygon points="316,695 360,695 364,730 312,730" fill="currentColor" opacity="0.4" />
    </g>
    <!-- Right Flyback Booster with Canted Canards -->
    <g stroke="currentColor" stroke-width="2">
      <path d="M 444 180 C 444 130 462 115 462 115 C 462 115 480 130 480 180 Z" fill="url(#sts2Booster)" />
      <rect x="444" y="180" width="36" height="515" fill="url(#sts2Booster)" />
      <!-- Canard Fin -->
      <polygon points="480,220 515,250 515,260 480,245" fill="url(#sts2Wing)" stroke-width="1.6" />
      <!-- Engine Nozzles -->
      <polygon points="440,695 484,695 488,730 436,730" fill="currentColor" opacity="0.4" />
    </g>

    <!-- Shuttle v2 Next-Gen Orbiter (Blended Wing-Body, Winglets) -->
    <!-- Continuous Aerodynamic Wing Sweep -->
    <path d="M 388 230 C 370 320 310 460 230 630 L 235 655 L 255 640 L 360 635 L 372 645 L 428 645 L 440 635 L 545 640 L 565 655 L 570 630 C 490 460 430 320 412 230 Z" fill="url(#sts2Wing)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Winglet Wingtips -->
    <polygon points="230,630 220,590 235,615" fill="currentColor" opacity="0.6" stroke="currentColor" stroke-width="1.6" />
    <polygon points="570,630 580,590 565,615" fill="currentColor" opacity="0.6" stroke="currentColor" stroke-width="1.6" />

    <!-- Orbiter Fuselage & Cockpit -->
    <path d="M 386 195 C 386 165 400 150 400 150 C 400 150 414 165 414 195 L 414 635 L 386 635 Z" fill="url(#sts2Body)" stroke="currentColor" stroke-width="2" />
    <polygon points="391,190 400,185 409,190 405,196 395,196" fill="currentColor" opacity="0.8" />

    <!-- Twin Canted Vertical Fins (V-tail) -->
    <polygon points="370,550 350,470 365,475 385,550" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-width="1.8" />
    <polygon points="430,550 450,470 435,475 415,550" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-width="1.8" />

    <!-- Aerospike / Advanced Linear Engine Nozzle Bank -->
    <rect x="382" y="640" width="36" height="25" rx="3" fill="currentColor" opacity="0.5" stroke="currentColor" stroke-width="1.8" />
  </g>
</svg>