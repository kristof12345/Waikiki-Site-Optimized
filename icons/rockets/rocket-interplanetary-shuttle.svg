<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none" style="color: #003366;">
  <defs>
    <linearGradient id="ipsBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.12" />
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.28" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="ipsBooster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.15" />
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.32" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="ipsWing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.22" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.08" />
    </linearGradient>
    <pattern id="ipsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Coordinate Grid -->
  <rect x="20" y="20" width="760" height="760" fill="url(#ipsGrid)" />

  <!-- Technical Axis and Grid -->
  <g opacity="0.25" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="400" y1="25" x2="400" y2="775" />
    <line x1="25" y1="400" x2="775" y2="400" />
    <circle cx="400" cy="400" r="350" />
    <circle cx="400" cy="400" r="220" />
    <circle cx="400" cy="400" r="100" />
  </g>

  <!-- Dimensions Callouts -->
  <g opacity="0.6" stroke="currentColor" stroke-width="1">
    <!-- Height bar -->
    <line x1="160" y1="45" x2="130" y2="45" />
    <line x1="160" y1="755" x2="130" y2="755" />
    <line x1="145" y1="45" x2="145" y2="755" stroke-dasharray="4 4" />
    <text x="130" y="400" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="11" letter-spacing="2" opacity="0.85" transform="rotate(-90 130 400)" stroke="none">HEIGHT 88.0 M</text>

    <!-- Width / Diameter bar -->
    <line x1="300" y1="765" x2="300" y2="785" />
    <line x1="500" y1="765" x2="500" y2="785" />
    <line x1="300" y1="775" x2="500" y2="775" stroke-dasharray="4 4" />
    <text x="400" y="792" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="10.5" letter-spacing="2" opacity="0.85" stroke="none">SPAN 32.0 M</text>
  </g>

  <!-- Rocket Technical Vector Graphic -->
  <g id="vehicle-graphic">
    <!-- Forward Exploration Bridge & High-Gain Antenna -->
    <line x1="400" y1="40" x2="400" y2="85" stroke="currentColor" stroke-width="2" />
    <path d="M 385 55 Q 400 40 415 55" stroke="currentColor" stroke-width="2.2" fill="none" />
    <circle cx="400" cy="50" r="3" fill="currentColor" />

    <!-- Forward Command Module & Cupola Observation Dome -->
    <polygon points="388,85 412,85 422,140 378,140" fill="url(#ipsBody)" stroke="currentColor" stroke-width="2.2" />
    <polygon points="394,105 406,105 408,118 392,118" fill="currentColor" opacity="0.75" />

    <!-- Crew Habitation Module & Science Deck -->
    <rect x="378" y="140" width="44" height="120" fill="url(#ipsBody)" stroke="currentColor" stroke-width="2.2" />
    <circle cx="390" cy="170" r="3.5" fill="currentColor" opacity="0.7" />
    <circle cx="410" cy="170" r="3.5" fill="currentColor" opacity="0.7" />
    <circle cx="390" cy="210" r="3.5" fill="currentColor" opacity="0.7" />
    <circle cx="410" cy="210" r="3.5" fill="currentColor" opacity="0.7" />

    <!-- Deployable Photovoltaic & Thermal Radiator Wings -->
    <!-- Left Radiator Wing -->
    <g stroke="currentColor" stroke-width="1.8">
      <polygon points="378,260 210,380 210,540 378,480" fill="url(#ipsWing)" />
      <!-- Grid Panel Lines -->
      <line x1="250" y1="405" x2="250" y2="525" stroke-width="1" />
      <line x1="290" y1="375" x2="290" y2="510" stroke-width="1" />
      <line x1="330" y1="345" x2="330" y2="495" stroke-width="1" />
      <line x1="210" y1="460" x2="378" y2="460" stroke-width="1" />
    </g>
    <!-- Right Radiator Wing -->
    <g stroke="currentColor" stroke-width="1.8">
      <polygon points="422,260 590,380 590,540 422,480" fill="url(#ipsWing)" />
      <!-- Grid Panel Lines -->
      <line x1="550" y1="405" x2="550" y2="525" stroke-width="1" />
      <line x1="510" y1="375" x2="510" y2="510" stroke-width="1" />
      <line x1="470" y1="345" x2="470" y2="495" stroke-width="1" />
      <line x1="422" y1="460" x2="590" y2="460" stroke-width="1" />
    </g>

    <!-- Modular Spine / Cryogenic Propellant Tanks -->
    <rect x="382" y="260" width="36" height="360" fill="url(#ipsBody)" stroke="currentColor" stroke-width="2.2" />
    <!-- Structural Truss Framing -->
    <g stroke="currentColor" stroke-width="1" opacity="0.65">
      <line x1="382" y1="330" x2="418" y2="330" />
      <line x1="382" y1="400" x2="418" y2="400" />
      <line x1="382" y1="470" x2="418" y2="470" />
      <line x1="382" y1="540" x2="418" y2="540" />
      <line x1="382" y1="610" x2="418" y2="610" />
      <!-- X-bracing in spine -->
      <line x1="382" y1="260" x2="418" y2="330" stroke-dasharray="2 2" />
      <line x1="418" y1="260" x2="382" y2="330" stroke-dasharray="2 2" />
    </g>

    <!-- Radiation Shadow Shield at Base of Reactor -->
    <polygon points="360,620 440,620 446,655 354,655" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.2" />

    <!-- Dual High-Impulse Nuclear Thermal Rocket (NTR) Engines -->
    <g stroke="currentColor" stroke-width="2">
      <!-- Left NTR Engine Bell -->
      <polygon points="368,655 394,655 398,730 360,730" fill="currentColor" opacity="0.6" />
      <!-- Right NTR Engine Bell -->
      <polygon points="406,655 432,655 440,730 402,730" fill="currentColor" opacity="0.6" />
    </g>
  </g>
</svg>